apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-validator-trusted-ca
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-validator
spec:
  replicas: 1
  selector:
    matchLabels: {app: portal-validator}
  template:
    metadata:
      labels: {app: portal-validator}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: portal-validator
        image: docker.io/mohankrishna999/portal-validator:1.2.0
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits: {cpu: "2", memory: "2Gi"}
        env:
        - name: SESSION_STATE_DIR
          value: /auth
        - name: MAX_CONCURRENT_SCANS
          value: "2"
        - name: HOME
          value: /tmp/portal-validator-home
        - name: PLAYWRIGHT_BROWSERS_PATH
          value: /ms-playwright
        - name: PORTAL_VALIDATOR_MANAGED_CA_BUNDLE
          value: /etc/portal-validator/certs/ca-bundle.crt
        - name: PORTAL_VALIDATOR_ADDITIONAL_CA_FILES
          value: /etc/portal-validator/centene/CNC-ROOT-CA.crt
        - name: RUNTIME_CA_BUNDLE
          value: /tmp/portal-validator-home/.portal-validator/ca-bundle.crt
        - name: CHROMIUM_NSS_DB
          value: /tmp/portal-validator-home/.local/share/pki/nssdb
        - name: SSL_CERT_FILE
          value: /tmp/portal-validator-home/.portal-validator/ca-bundle.crt
        - name: REQUESTS_CA_BUNDLE
          value: /tmp/portal-validator-home/.portal-validator/ca-bundle.crt
        - name: CURL_CA_BUNDLE
          value: /tmp/portal-validator-home/.portal-validator/ca-bundle.crt
        volumeMounts:
        - name: auth-state
          mountPath: /auth
          readOnly: true
        - name: trusted-ca
          mountPath: /etc/portal-validator/certs
          readOnly: true
        - name: additional-ca
          mountPath: /etc/portal-validator/centene
          readOnly: true
        - name: runtime-tmp
          mountPath: /tmp
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 15
      volumes:
      - name: auth-state
        secret:
          secretName: portal-validator-auth
          optional: true
      - name: trusted-ca
        configMap:
          name: portal-validator-trusted-ca
          items:
          - key: ca-bundle.crt
            path: ca-bundle.crt
      - name: additional-ca
        configMap:
          name: portal-validator-additional-ca
          items:
          - key: enterprise-root-ca.crt
            path: CNC-ROOT-CA.crt
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portal-validator
spec:
  selector: {app: portal-validator}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: portal-validator
spec:
  to: {kind: Service, name: portal-validator}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
