apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-validator
spec:
  replicas: 1
  selector:
    matchLabels: {app: portal-validator}
  template:
    metadata:
      labels: {app: portal-validator}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: portal-validator
        image: docker.io/mohankrishna999/portal-validator:prod-09-29-2026
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: ["ALL"]}
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
        resources:
          requests: {cpu: "250m", memory: "512Mi"}
          limits: {cpu: "2", memory: "2Gi"}
        env:
        - name: SESSION_STATE_DIR
          value: /auth
        - name: MAX_CONCURRENT_SCANS
          value: "2"
        volumeMounts:
        - name: auth-state
          mountPath: /auth
          readOnly: true
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 15
      volumes:
      - name: auth-state
        secret:
          secretName: portal-validator-auth
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: portal-validator
spec:
  selector: {app: portal-validator}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: portal-validator
spec:
  to: {kind: Service, name: portal-validator}
  port: {targetPort: 8080}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
